[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cata-context-api"
version = "0.4.0a1"
description = "Read-only CATA realm context, build 15595"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
cata-context = "cata_context.cli:main"
cata-context-mcp = "cata_context.mcp_server:main"

[tool.setuptools.packages.find]
include = ["cata_context*", "_cata_context_core*"]
