name: Validate release inputs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }} / ${{ matrix.extra }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', extra: core}
          - {os: ubuntu-latest, python: '3.11', extra: mcp}
          - {os: ubuntu-latest, python: '3.14', extra: mcp}
          - {os: windows-latest, python: '3.14', extra: mcp}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core
        if: matrix.extra == 'core'
        run: python -m pip install -e .
      - name: Install optional MCP
        if: matrix.extra == 'mcp'
        run: python -m pip install -e ".[mcp]"
      - name: Reader, consumers and protocol checks
        run: python -m unittest discover -s tests -v

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - run: python -m build
      - name: Inspect distributable contents and install the wheel in isolation
        run: python scripts/check-release.py --artifacts dist
